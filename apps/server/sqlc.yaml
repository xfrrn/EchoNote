version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/000001_phase1.up.sql
      - migrations/000002_imports.up.sql
      - migrations/000003_notes.up.sql
      - migrations/000004_transcription.up.sql
      - migrations/000005_search.up.sql
      - migrations/000006_ai.up.sql
      - migrations/000007_identity.up.sql
      - migrations/000008_retention.up.sql
    queries: internal/database/queries
    gen:
      go:
        package: db
        out: internal/database/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: vector
            nullable: true
            go_type:
              type: string
              pointer: true
