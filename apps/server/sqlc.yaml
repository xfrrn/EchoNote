version: "2"
sql:
  - engine: postgresql
    schema: migrations/000001_phase1.up.sql
    queries: internal/database/queries
    gen:
      go:
        package: db
        out: internal/database/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
