version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/000001_phase1.up.sql
      - migrations/000002_imports.up.sql
      - migrations/000003_notes.up.sql
      - migrations/000004_transcription.up.sql
      - migrations/000005_search.up.sql
      - migrations/000006_ai.up.sql
      - migrations/000007_identity.up.sql
      - migrations/000008_retention.up.sql
      - migrations/000009_mcp_identity.up.sql
      - migrations/000010_transcription_service.up.sql
      - migrations/000011_snapany.up.sql
    queries: internal/database/queries
    gen:
      go:
        package: db
        out: internal/database/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
