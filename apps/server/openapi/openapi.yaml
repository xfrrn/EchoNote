openapi: 3.0.3
info:
  title: EchoNote API
  version: 0.7.0
  description: EchoNote modular-monolith HTTP API.
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        "200":
          description: The API process is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        "200":
          description: The API and PostgreSQL are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: PostgreSQL is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/imports:
    post:
      operationId: createImport
      summary: Queue an episode import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
      responses:
        "202":
          description: Import queued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/imports/{importId}:
    get:
      operationId: getImport
      summary: Get an import result
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Import state and resolved Episode when available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/episodes:
    get:
      operationId: listEpisodes
      summary: List recently imported episodes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        "200":
          description: User-scoped Episode page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/episodes/{episodeId}:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getEpisode
      summary: Get an Episode with Podcast and Sources
      responses:
        "200":
          description: Episode detail.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEpisode
      summary: Permanently delete an Episode
      responses:
        "204":
          description: Episode deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/captures:
    post:
      operationId: createCapture
      summary: Capture a note for an Episode or URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaptureRequest"
      responses:
        "200":
          description: Idempotent replay of an existing capture.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResponse"
        "201":
          description: Capture created; URL captures also queue an Import.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/episodes/{episodeId}/notes:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listEpisodeNotes
      summary: List active Notes for an Episode
      responses:
        "200":
          description: Notes ordered by client creation time, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createEpisodeNote
      summary: Create an idempotent Note for an Episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "200":
          description: Idempotent replay of an existing Note.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "201":
          description: Note created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateNote
      summary: Update a Note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Note updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteNote
      summary: Soft-delete a Note
      responses:
        "204":
          description: Note deleted or already deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/search:
    get:
      operationId: searchContent
      summary: Search Notes, Transcript, and indexed AI content
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 500
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/SearchScope"
            default: library
        - name: episode_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Ranked keyword or hybrid search results.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/search/reindex:
    post:
      operationId: reindexSearch
      summary: Enqueue an explicit Search index rebuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexSearchRequest"
      responses:
        "202":
          description: Rebuild Jobs were queued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/episodes/{episodeId}/ai/artifacts:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listEpisodeAIArtifacts
      summary: List cached and historical AI Artifacts for an Episode
      responses:
        "200":
          description: AI Artifact history, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIArtifactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: requestEpisodeAIArtifact
      summary: Return a cached Episode summary or enqueue on-demand generation
      responses:
        "200":
          description: An input-identical cached Artifact was returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIArtifact"
        "202":
          description: Generation is queued or already in progress.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIArtifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: Create an Episode-scoped AI Conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getConversation
      summary: Get a Conversation with durable Messages and Citations
      responses:
        "200":
          description: Conversation detail.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: streamConversationMessage
      summary: Ask an Episode question and stream a citation-validated answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationMessageRequest"
      responses:
        "200":
          description: >-
            SSE events. delta data is {"text":"..."}; citation data is an
            AICitation; done data is {"message_id":"...","replayed":false};
            error data is the standard APIError object.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/episodes/{episodeId}/transcriptions:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createTranscription
      summary: Start a versioned Episode transcription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTranscriptionRequest"
      responses:
        "202":
          description: Transcription queued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcriptions/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTranscription
      summary: Get transcription workflow state
      responses:
        "200":
          description: Transcription workflow state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcriptions/{runId}/events:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTranscriptionEvents
      summary: Stream durable transcription events
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Return durable events after this event ID.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: SSE events. Event IDs can be resumed with Last-Event-ID.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcriptions/{runId}/retry:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: retryTranscription
      summary: Retry only the failed transcription stage or chunks
      responses:
        "202":
          description: Failed work queued again.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcriptions/{runId}/cancel:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelTranscription
      summary: Cancel local work and request cancellation of queued ASR tasks
      responses:
        "200":
          description: Current run state after cancellation request.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/episodes/{episodeId}/transcript:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getEpisodeTranscript
      summary: Get the active Transcript Version and Speakers
      responses:
        "200":
          description: Active Transcript Version.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcripts/{transcriptId}/segments:
    parameters:
      - name: transcriptId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTranscriptSegments
      summary: List ordered Transcript Segments
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        "200":
          description: Ordered Segment page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSegmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcripts/{transcriptId}/speakers/{speakerId}:
    parameters:
      - name: transcriptId
        in: path
        required: true
        schema:
          type: string
      - name: speakerId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTranscriptSpeaker
      summary: Rename a Global Speaker or update its role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTranscriptSpeakerRequest"
      responses:
        "200":
          description: Updated Speaker.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSpeaker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/transcripts/{transcriptId}/speakers/merge:
    parameters:
      - name: transcriptId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mergeTranscriptSpeakers
      summary: Merge one Global Speaker into another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTranscriptSpeakersRequest"
      responses:
        "200":
          description: Target Speaker after merge.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSpeaker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestID:
      description: Request correlation identifier.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state conflicts with the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required provider configuration is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateImportRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 4096
    ImportResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - status
        - stage
        - created_at
        - updated_at
      properties:
        id:
          type: string
        url:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
        stage:
          type: string
        episode_id:
          type: string
        error:
          $ref: "#/components/schemas/ImportError"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    CreateCaptureRequest:
      type: object
      additionalProperties: false
      description: Exactly one of episode_id and episode_url must be supplied.
      required:
        - client_note_id
        - content
        - created_at
      properties:
        client_note_id:
          type: string
        episode_id:
          type: string
        episode_url:
          type: string
          minLength: 1
          maxLength: 4096
        content:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    CreateNoteRequest:
      type: object
      additionalProperties: false
      required:
