openapi: 3.0.3
info:
  title: EchoNote Internal Transcription API
  version: 0.2.0
  description: Private API used only by the EchoNote MCP server.
paths:
  /healthz:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/transcriptions:
    post:
      operationId: createTranscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTranscriptionRequest"
      responses:
        "202":
          description: Transcription was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionTask"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/transcriptions/{taskId}:
    get:
      operationId: getTranscription
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current task state. Markdown is present when completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionTask"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateTranscriptionRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 4096
    TranscriptionTaskStatus:
      type: string
      enum:
        - queued
        - resolving
        - downloading
        - preparing
        - transcribing
        - aligning
        - merging
        - completed
        - failed
    TranscriptionError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    TranscriptionTask:
      type: object
      additionalProperties: false
      required:
        - id
        - source_url
        - status
        - stage
        - completed_chunks
        - total_chunks
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        source_url:
          type: string
          format: uri
        title:
          type: string
        status:
          $ref: "#/components/schemas/TranscriptionTaskStatus"
        stage:
          type: string
        completed_chunks:
          type: integer
          minimum: 0
        total_chunks:
          type: integer
          minimum: 0
        markdown:
          type: string
          description: Complete Markdown transcript; only present after completion.
        error:
          $ref: "#/components/schemas/TranscriptionError"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        database:
          type: string
          enum:
            - up
            - down
