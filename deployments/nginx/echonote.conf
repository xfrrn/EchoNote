map "$request_method:$uri" $echonote_login_limit_key {
    default "";
    "POST:/api/v1/auth/login" $binary_remote_addr;
}

map "$request_method:$uri" $echonote_costly_limit_key {
    default "";
    ~^POST:/api/v1/imports$ $binary_remote_addr;
    ~^GET:/api/v1/search$ $binary_remote_addr;
    "POST:/api/v1/search/reindex" $binary_remote_addr;
    ~^POST:/api/v1/episodes/[0-9a-fA-F-]+/(transcriptions|ai/artifacts)$ $binary_remote_addr;
    ~^POST:/api/v1/episodes/[0-9a-fA-F-]+/exports$ $binary_remote_addr;
    ~^POST:/api/v1/transcriptions/[0-9a-fA-F-]+/(retry|cancel)$ $binary_remote_addr;
    ~^POST:/api/v1/conversations/[0-9a-fA-F-]+/messages$ $binary_remote_addr;
}

limit_req_zone $echonote_login_limit_key zone=echonote_login:10m rate=5r/m;
limit_req_zone $echonote_costly_limit_key zone=echonote_costly:10m rate=30r/m;

upstream echonote_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.example.com;

    root /opt/echonote/current/web;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:echonote_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; media-src 'none'; worker-src 'self'; upgrade-insecure-requests" always;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/echonote-proxy.conf;
    }

    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        include /etc/nginx/snippets/echonote-proxy.conf;
    }

    location ~ ^/api/v1/(transcriptions/[0-9a-fA-F-]+/events|conversations/[0-9a-fA-F-]+/messages)$ {
        include /etc/nginx/snippets/echonote-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location /api/ {
        include /etc/nginx/snippets/echonote-proxy.conf;
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    location ~* ^/assets/.+-[0-9A-Za-z_-]+\.(js|css)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /index.html { expires -1; }
    location = /sw.js { expires -1; }
    location = /registerSW.js { expires -1; }
    location = /theme-init.js { expires -1; }
    location = /manifest.webmanifest { expires -1; }
    location = /manifest-dark.webmanifest { expires -1; }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
