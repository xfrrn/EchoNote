name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: echonote_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echonote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      # Exercise migration compatibility with the pgxpool-only production DSN option.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/echonote_test?sslmode=disable&pool_max_conns=5
      ECHONOTE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/echonote_test?sslmode=disable&pool_max_conns=5
      ECHONOTE_MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/echonote_test?sslmode=disable&pool_max_conns=5
      ECHONOTE_OWNER_ID: 00000000-0000-4000-8000-000000000001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/migrate up
        working-directory: apps/server
      - run: go generate ./...
        working-directory: apps/server
      - run: git diff --check
      - run: git diff --exit-code
      # Integration packages share one disposable database, so keep package tests serial.
      - run: go test -p 1 ./... -count=1
        working-directory: apps/server
      - run: go vet ./...
        working-directory: apps/server
      - name: Build production binaries
        run: |
          mkdir -p release/bin
          for command in api worker migrate admin maintenance; do
            CGO_ENABLED=0 go -C apps/server build -trimpath -o "../../release/bin/echonote-$command" "./cmd/$command"
          done
      - run: pnpm test
